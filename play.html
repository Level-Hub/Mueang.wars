 lv=G.vil?G.vil.level:1;stock=estStock();paint();arrows()}
function live(){const n=Date.now(),R=G.rounds.find(r=>+new Date(r.starts_at)<=n&&n<+new Date(r.ends_at));
 if(R){rd=R.round_no;const a=+new Date(R.starts_at),p=+new Date(R.planning_ends_at),d=+new Date(R.discussion_ends_at),e=+new Date(R.ends_at);PH=n<p?0:n<d?1:2;
  const A=[a,p,d][PH],Z=[p,d,e][PH],q=Math.max(0,Math.ceil((Z-n)/1000));$('sec').style.fontSize='11px';$('sec').textContent=Math.floor(q/60)+':'+String(q%60).padStart(2,'0');
  $('arc').style.strokeDashoffset=138.2*(1-(Z-n)/(Z-A));$('rn').textContent='รอบที่ '+R.round_no+' · ตัดสิน '+hm(R.resolve_at)+' น.'}
 else{const N=G.rounds.find(r=>+new Date(r.starts_at)>n);PH=1;$('sec').textContent='--';$('arc').style.strokeDashoffset=138.2;$('rn').textContent=N?'พักรบ · รอบที่ '+N.round_no+' เริ่ม '+hm(N.starts_at)+' น.':'ยังไม่มีรอบที่เปิด'}
 document.body.dataset.p=PH;[0,1,2].forEach(i=>$('s'+i).classList.toggle('on',i===PH))}
async function pick(i){const x=T[i];sel=i;$('sh').style.setProperty('--ac',col(me));$('sh').style.setProperty('--to',col(x.o));$('sh').scrollTop=0;map.append(x.e,x.l,x.d,x.q,lb,ar,pg,fxg);if(cam.z<2)auto=true;zoomTo(x.c[0],x.c[1],Math.max(cam.z,2.6));$('mapw').scrollIntoView({behavior:'smooth',block:'start'});
 const head=`<div class="ph"><span class="pe">${em(x.o)}</span><div class="pt"><small>จังหวัด</small><b>${x.n}</b></div><span class="tag">${RG[x.o][1]}</span></div>`;
 const rs=G.rounds.filter(r=>+new Date(r.planning_ends_at)>Date.now()&&r.status!=='revealed').slice(0,G.cfg.advance_rounds||3);
 if(x.o===me||!rs.length){$('sh').innerHTML=head+'<div class="pw">'+wxHtml(i)+'</div><div class="ps"><small>'+(x.o===me?ic('shield')+' จังหวัดของภาคคุณ':ic('clock')+' ตอนนี้ยังไม่มีรอบที่ส่งทัพได้')+'</small></div><div class="act"><button id="cl">ปิด</button></div>';$('sh').classList.add('open');$('cl').onclick=shut;paint();return}
 stock=estStock();G.n=Math.max(1,Math.round(stock/2));G.off=0;G.pv=null;
 $('sh').innerHTML=head+'<div class="pw">'+wxHtml(i)+dpHtml(i)+fcHtml(i)+'</div><div class="ps">'+`<small>${RAIN[i]?RLN[RAIN[i]]+'ตอนนี้ ผู้โจมตีอ่อนลง · ':''}ส่งแล้วเรียกกลับไม่ได้</small><select id="ro">${rs.map((r,k)=>`<option value="${k}">ส่งในรอบที่ ${r.round_no} · ตัดสิน ${hm(r.resolve_at)} น.</option>`).join('')}</select><div class="amt"><b id="rv">${G.n}</b> <small>/ <span id="mx">${stock}</span> กำลังพล</small></div><input id="rg" type="range" min="1" max="${Math.max(1,stock)}" value="${G.n}"><div class="q"><button data-f=".25">¼</button><button data-f=".5">½</button><button data-f="1">เต็ม</button></div><div id="od"></div></div><div class="act"><button id="ok" class="go" disabled>${ic('swords')} ส่งทัพ</button><button id="cl">ปิด</button></div>`;
 const g=$('rg');
 window.setN=n=>{G.n=Math.max(0,Math.min(stock,Math.floor(n)));g.value=G.n;g.style.setProperty('--p',(stock?G.n/stock*100:0)+'%');$('rv').textContent=G.n;sched()};
 g.oninput=()=>setN(g.value);$('ro').onchange=()=>{G.off=+$('ro').value;sched()};
 document.querySelectorAll('.q button').forEach(b=>b.onclick=()=>setN(Math.max(1,Math.round(stock*b.dataset.f))));
 $('cl').onclick=shut;$('ok').onclick=send1;$('sh').classList.add('open');paint();setN(G.n)}
function sched(){clearTimeout(G.tm);G.pv=null;rpv();if(G.n<1)return;G.tm=setTimeout(dopv,250)}
async function dopv(){const my=++G.seq;if(sel<0)return;
 const {data,error}=await sb.rpc('v2_preview_send',{p_province:T[sel].code,p_troops:G.n,p_offset:G.off});if(my!==G.seq)return;
 G.pv=error?{blocked:true,reason:error.message}:data;
 if(data&&typeof data.stock==='number'&&data.stock!==stock){stock=data.stock;const m=$('mx'),g=$('rg');if(m)m.textContent=stock;if(g)g.max=Math.max(1,stock)}rpv()}

 if(G.n<1){o.innerHTML=ic('warn')+' ใส่จำนวนกำลังพลก่อน';b.disabled=true;return}
 if(!p){o.textContent='กำลังคำนวณ…';b.disabled=true;return}
 const has=p.arrive_round_no!=null,pc=p.power_factor_pct,weak=!p.blocked&&has&&pc<50,u=has&&p.units?Object.entries(p.units).filter(([,v])=>v>0).map(([k,v])=>UN(k)+' '+v).join(' · '):'';
 const rl=has&&p.rain_level!=null?'<span class="rl">'+wic(p.rain_level>=3?'storm':p.rain_level?'rain':'sun')+(p.rain_level?' ตอนทัพถึง'+RLN[p.rain_level]+' · แรงบุก <b>−'+p.rain_penalty_pct+'%</b> · ลองเลื่อนไปรอบอื่นดูได้':' ตอนทัพถึงฟ้าโปร่ง ไม่มีฝนลดแรง')+'</span>':'';
 o.innerHTML=(p.blocked?ic('x')+' ส่งไม่ได้: '+esc2(p.reason||'')+'<br>':'')+(has?ic(weak||p.rain_level>=2?'warn':'check')+` ถึงรอบที่ ${p.arrive_round_no} (เดิน ${p.eta_rounds} รอบ) · ${esc2(u)}<br>ห่างเขตแดนภาคเรา ${p.ext} ช่อง · แรงโจมตีที่ไปถึง <b>${pc}%</b>`+(weak?' · แรงอ่อนมาก':'')+rl:'');markFc(p);
 b.disabled=!!p.blocked;b.style.background=weak?'linear-gradient(90deg,#e08a12,#ffb02e)':'';b.innerHTML=ic('swords')+(weak?' ส่งทั้งที่แรงอ่อน':' ส่งทัพ')}

 const x=T[i];navigator.vibrate&&navigator.vibrate(25);fly(origin(me,x.c),x.c,col(me),Math.min(8,Math.ceil(G.n/10)));ring(x.c,col(me));

(async()=>{try{
 const {data:{session}}=await sb.auth.getSession();if(!session)return location.replace('index.html');

 (u.data||[]).forEach(x=>G.units[x.id]=x);(c.data||[]).forEach(x=>G.cfg[x.key]=Number(x.value));(l.data||[]).forEach(x=>G.lv[x.level]=x);rlLegend();
 go(Math.max(0,RID.indexOf(p.region_id)));await load();live();setInterval(live,500);setInterval(()=>{if(!document.hidden&&!$('sh').classList.contains('open'))load()},15000)
}catch(e){console.error(e)}document.body.style.visibility=''})();
