function chestHtml(d){const m=new Map();d.shards.forEach(s=>{const e=m.get(s.item_id)||Object.assign({},s,{n:0});e.n++;m.set(s.item_id,e)});
 const pr={};d.progress.forEach(p=>pr[p.item_id]=p);
 const arr=[...m.values()].sort((a,b)=>b.rarity-a.rarity||b.n-a.n),leg=arr.some(x=>x.rarity==='3');
 return '<h2>'+(leg?'ได้เศษตำนาน!':'ได้ '+d.shards.length+' เศษ')+'</h2><p>'+esc(pn(d.province_code))+(d.boosted?' · หีบนี้โอกาสเศษตำนานเพิ่มขึ้น':'')+'</p><div class="rl">'+
  arr.map(x=>{const p=pr[x.item_id]||{have:x.n,need:1,owned:false},rd=p.have>=p.need&&!p.owned;
   return '<div class="pi r'+esc(x.rarity)+'">'+tile(x.art_key,x.rarity,'xs')+'<div class="sb"><b>'+esc(x.name_th)+'</b><small>'+esc(rn(x.rarity))+' · +'+x.n+' เศษ'+(rd?' · <span class="tg">ประกอบได้แล้ว</span>':p.owned?' · มีในคลังแล้ว':'')+'</small><div class="bar"><i style="width:'+pct(p.have,p.need)+'%"></i></div></div><span class="sn">'+p.have+'/'+p.need+'</span></div>'}).join('')+
  '</div><p>เหรียญคงเหลือ '+nf(d.coins)+'</p>'}
async function buy(n){if(busy)return;busy=true;try{const {data,error}=await sb.rpc('buy_chest',{p_qty:n});if(error){toast(error.message);return}toast('ซื้อหีบ '+data.bought+' ใบ · เหรียญเหลือ '+nf(data.coins));await load()}finally{busy=false}}
async function rates(){const sp=(O.shop||[])[0],R=O.shard_rules||{};let d=null;try{d=await getOdds(sp?sp.kind:'province',0)}catch(e){}
 if(!d||!d.by_rarity){$('rts').hidden=true;return}
 const need=R.need||{},st=+R.pity_step||0,cap=+R.pity_cap||0,lim=+R.pity_chests||0;
 $('rts').hidden=false;$('rt').innerHTML='<p class="hint" style="margin-bottom:8px">หีบ 1 ใบให้ '+(sp?sp.shards_per_open:d.shards_per_open)+' เศษ สุ่มทีละเศษแยกกัน จากไอเทม 4 ชิ้นของจังหวัดที่เลือก</p><div class="od">'+
  d.by_rarity.map(r=>'<div><span>'+esc(rn(r.rarity))+' (รวมทุกชิ้น) · ประกอบต้องใช้ '+(need[r.rarity]||'?')+' เศษ</span><span>'+r.pct+'%</span></div>').join('')+'</div>'+
  (lim&&st?'<p class="hint">โชคช่วย: ถ้าเปิดหีบจังหวัดเดิมครบ '+lim+' ใบแล้วยังประกอบตำนานของจังหวัดนั้นไม่ได้ ตั้งแต่ใบถัดไปโอกาสเศษตำนานเพิ่มขึ้นใบละ '+st+' จุดเปอร์เซ็นต์'+(cap?' (เพิ่มรวมสูงสุด '+cap+')':'')+' ส่วนที่เพิ่มหักจากเศษสามัญ และนับใหม่เมื่อมีเศษตำนานครบหรือประกอบได้แล้ว</p>':'')+'<p class="hint">ตัวเลขดึงจากระบบจริงทุกครั้งที่เปิดหน้านี้</p>'}
async function openChest(id){if(busy)return;busy=true;
 const c=O.chests.find(x=>x.id==id),s=$('pv'+id),args={p_grant_id:+id};
 if(c&&c.pick_province){if(!s||!s.value){busy=false;toast('เลือกจังหวัดก่อนเปิดหีบ');return}args.p_province=+s.value}
 const {data,error}=await sb.rpc('open_chest',args);
 if(error){busy=false;toast(error.message);return}
 /* ได้ผลจากเซิร์ฟเวอร์แล้วค่อยเล่นอนิเมชัน (ห้ามสุ่มฝั่งเครื่อง) */
 showRv(chestHtml(data),true,data.shards.reduce((m,x)=>Math.max(m,+x.rarity||0),0)||0)}
function dzFind(id){const rows=O.inventory.filter(i=>i.item_id==id),u=rows.find(i=>!i.bound),t=rows.reduce((a,i)=>a+i.qty,0);
 if(!u||!DR)return null;const max=Math.min(u.qty,t-1,99),val=+(DR.coins||{})[u.rarity];if(max<1||!(val>0))return null;
 return {id:u.item_id,name:u.name_th,r:u.rarity,art:u.art_key,max:max,val:val,q:1}}
function dzPaint(){const z=DZ;
 $('dc').innerHTML='<h2>ย่อยของซ้ำเป็นเหรียญ</h2>'+tile(z.art,z.r)+'<h2>'+esc(z.name)+'</h2><p>'+esc(rn(z.r))+' · ชิ้นละ '+nf(z.val)+' เหรียญ<br>ย่อยแล้วเหรียญเข้ากระเป๋าทันที เอาของกลับคืนไม่ได้</p>'+
  (z.max>1?'<div class="stp"><button type="button" class="btn gh" data-dzm="-1" aria-label="ลดจำนวน"'+(z.q<=1?' disabled':'')+'>−</button><b aria-live="polite">'+z.q+'</b><button type="button" class="btn gh" data-dzm="1" aria-label="เพิ่มจำนวน"'+(z.q>=z.max?' disabled':'')+'>+</button></div>':'')+
  '<p class="dgv">ย่อย '+z.q+' ชิ้น จะได้ <b>'+nf(z.val*z.q)+'</b> เหรียญ</p><div class="act"><button type="button" class="btn gh" data-dzx>ยกเลิก</button><button type="button" class="btn gl" data-dzy>ยืนยันย่อย</button></div>'}
function dzOpen(id){if(busy)return;const z=dzFind(id);if(!z){toast('ย่อยชิ้นนี้ไม่ได้');return}
 DZ=z;dzPaint();$('dg').hidden=false;const x=$('dc').querySelector('[data-dzx]');x&&x.focus()}
function dzClose(){DZ=null;$('dg').hidden=true}
async function dzGo(){if(busy||!DZ)return;busy=true;const z=DZ;
 const {data,error}=await sb.rpc('dissolve_item',{p_item_id:+z.id,p_qty:z.q});
 dzClose();
 if(error){busy=false;toast(error.message);await load();return}
 showRv('<h2>ย่อยสำเร็จ</h2>'+tile(z.art,z.r)+'<h2>'+esc(z.name)+'</h2><p>ย่อย '+data.dissolved+' ชิ้น · ได้ '+nf(data.coins_gained)+' เหรียญ<br>เหรียญคงเหลือ '+nf(data.coins)+' · เหลือในคลัง '+data.left+' ชิ้น</p>',false)}
async function craft(itemId){if(busy)return;busy=true;
 const {data,error}=await sb.rpc('craft_item',{p_item_id:+itemId});
 if(error){busy=false;toast(error.message);return}
 const it=data.item;
 showRv('<h2>ประกอบสำเร็จ</h2>'+tile(it.art_key,it.rarity)+'<h2>'+esc(it.name_th)+'</h2><p>'+esc(rn(it.rarity))+' · '+esc(pn(it.province_code))+(data.is_new?' · ของใหม่ในคลัง!':' · ได้เพิ่มอีก 1 ชิ้น')+(data.bound?' · ผูกบัญชี':'')+'<br>ใช้ '+data.used+' เศษ · เหลือ '+data.shards_left+' เศษ</p>',false,it.rarity)}
document.addEventListener('click',e=>{const a=e.target.closest('[data-open]'),b=e.target.closest('[data-odds]'),c=e.target.closest('[data-craft]');
 if(a&&!a.disabled)openChest(a.dataset.open);else if(c&&!c.disabled)craft(c.dataset.craft);else if(b)odds(b.dataset.odds,b.dataset.for);else{const y=e.target.closest('[data-buy]');if(y&&!y.disabled)buy(+y.dataset.buy)}});
document.addEventListener('click',e=>{const d=e.target.closest('[data-dis]'),m=e.target.closest('[data-dzm]'),y=e.target.closest('[data-dzy]'),x=e.target.closest('[data-dzx]');
 if(d){dtClose();dzOpen(d.dataset.dis)}else if(m&&DZ&&!m.disabled){DZ.q=Math.max(1,Math.min(DZ.max,DZ.q+(+m.dataset.dzm)));dzPaint();const b=$('dc').querySelector('[data-dzm="'+m.dataset.dzm+'"]');b&&!b.disabled&&b.focus()}
 else if(y&&!y.disabled)dzGo();else if(x||e.target.id==='dg')dzClose()});
document.addEventListener('click',e=>{const t=e.target.closest('.dd-t'),o=e.target.closest('.dd-o');
 if(o){pickProv(+o.dataset.p);return}
 if(t){const d=t.closest('.dd');ddSet(d,d.querySelector('.dd-l').hidden);return}
 if(!e.target.closest('.dd'))document.querySelectorAll('.dd.on').forEach(d=>ddSet(d,false))});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('dt').hidden){dtClose();return}if(DZ&&!busy)dzClose();return document.querySelectorAll('.dd.on').forEach(d=>ddSet(d,false))}
 if((e.key==='ArrowDown'||e.key==='ArrowUp')&&e.target.closest&&e.target.closest('.dd-t,.dd-o')){const d=e.target.closest('.dd'),l=d.querySelector('.dd-l');e.preventDefault();if(l.hidden)ddSet(d,true);
  const os=[...l.querySelectorAll('.dd-o')],i=os.indexOf(document.activeElement),n=e.key==='ArrowDown'?Math.min(os.length-1,i+1):Math.max(0,i<0?0:i-1);os[n]&&os[n].focus()}});
document.addEventListener('click',e=>{const t=e.target.closest('[data-tab]'),i=e.target.closest('[data-it]'),r=e.target.closest('[data-pr]');
 if(t){TB=t.dataset.tab;try{sessionStorage.setItem('mw_tab',TB)}catch(x){}applyTab();window.scrollTo(0,0);return}
 if(e.target.id==='dt'||e.target.closest('[data-dtx]')){dtClose();return}
 if(i&&!e.target.closest('[data-craft],[data-dis]')&&O)dtItem(i.dataset.it);else if(r&&O)dtProv(r.dataset.pr)});
load();
['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{if(e.touches.length>1||(e.scale&&e.scale!==1))e.preventDefault()},{passive:false});
