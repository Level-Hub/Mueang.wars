 if(error){toast(error.message);return}
 const l=data||[];
 $('lst').innerHTML=l.length?l.map(t=>'<button type="button" class="th'+(t.user_id===cur?' on':'')+'" data-u="'+esc(t.user_id)+'" style="--k:var(--c'+rk(t.region_id)+')"><span class="t"><span>'+esc(t.username||'(ไม่พบโปรไฟล์)')+'</span>'+(t.unread?'<em>'+t.unread+'</em>':'')+'</span><p>'+(t.last_from_admin?'คุณ: ':'')+esc(t.last_body||'')+'</p><small>'+fT(t.last_at)+'</small></button>').join(''):'<p class="empty">ยังไม่มีข้อความจากผู้เล่น</p>'}
function actions(){
 const d=info,box=$('ac'),b=[],staff=!!d.is_staff,isMe=d.user_id===MYID;
 if(!staff&&!isMe)b.push(d.banned_at?'<button class="btn gh" type="button" data-a="unban">ปลดแบน</button>':'<button class="btn gl" type="button" data-a="ban">แบน</button>');
 if(ROLE==='ceo'){
  b.push('<button class="btn gd" type="button" data-a="chest">ให้หีบ</button>','<button class="btn gd" type="button" data-a="wallet">ปรับกระเป๋า</button>');
  if(!staff&&!isMe)b.push('<button class="btn sv" type="button" data-a="vip">ตั้ง VIP'+(d.vip_level?' (ตอนนี้ '+d.vip_level+')':'')+'</button>');
   if(!isMe&&d.staff_role!=='ceo')b.push(d.staff_role==='admin'?'<button class="btn gh" type="button" data-a="demote">ถอดแอดมิน</button>':'<button class="btn sv" type="button" data-a="promote">เลื่อนเป็นแอดมิน</button>')}
 box.innerHTML=b.join('');box.hidden=!b.length}
async function openThread(u,keepScroll){
 const {data,error}=await sb.rpc('admin_open_support_thread',{p_user:u});
 if(error){toast(error.message);return}
 info=data;cur=u;const log=$('log'),near=!keepScroll||log.scrollHeight-log.scrollTop-log.clientHeight<80,sr=data.staff_role||null;
 $('tp').classList.toggle('t-ceo',sr==='ceo');$('tp').classList.toggle('t-ad',sr==='admin');
 $('un').innerHTML=nameFx(data.username,sr,data.vip_level);$('ui').textContent=(data.region_id?RGN[rk(data.region_id)]+' · ':'')+'รหัส '+String(u).slice(0,8);
 $('ch').innerHTML=badge(sr,false,data.vip_level)+'<span class="chip">'+ico('cn')+nf(data.coins)+' เหรียญ</span><span class="chip">'+ico('dm')+nf(data.diamonds)+' เพชร</span>'+(data.banned_at?'<span class="chip bn">ถูกแบน'+(data.ban_reason?' · '+esc(data.ban_reason):'')+'</span>':'');$('ch').hidden=false;
 actions();
 log.innerHTML=(data.messages||[]).length?data.messages.map(m=>{const r=m.from_admin?(m.staff_role||'admin'):null;
  return '<div class="m '+(m.from_admin?'ad'+(r==='admin'?' ra':''):'us')+'">'+(m.from_admin?'<div class="mh">'+badge(r,true)+'</div>':'')+esc(m.body)+'<small>'+fT(m.created_at)+'</small><button type="button" class="x" data-id="'+esc(m.id)+'" aria-label="ลบข้อความ">✕</button></div>'}).join(''):'<p class="empty">ยังไม่มีข้อความ</p>';
 if(near)log.scrollTop=log.scrollHeight;
 $('bd').disabled=false;$('sd').disabled=false;$('cols').classList.add('open');loadList()}
async function reply(){
 if(sending||!cur)return;const v=$('bd').value.trim(),er=$('er');er.textContent='';
 if(!v)return er.textContent='พิมพ์ข้อความก่อน';
 sending=true;$('sd').disabled=true;
 const {error}=await sb.rpc('admin_reply_support',{p_user:cur,p_body:v});
 sending=false;$('sd').disabled=false;
 if(error)return er.textContent=error.message;
 $('bd').value='';$('ct').textContent='0/1000';await openThread(cur);toast('ส่งแล้ว')}
/* กล่องยืนยัน: ทุกปุ่มบังคับเหตุผล ≥ 3 ตัวอักษร · แสดงข้อความผิดพลาดจากหลังบ้านตรง ๆ · ฝั่งหลังบ้านตรวจสิทธิ์ซ้ำเสมอ */
function ask(o){
 return new Promise(res=>{
  $('mt').textContent=o.title;$('mx').textContent=o.desc||'';$('me2').textContent='';
  $('mf').innerHTML=(o.fields||[]).map(f=>'<label class="fl" for="f_'+f.id+'">'+esc(f.label)+'</label>'+(f.type==='select'?'<select class="in" id="f_'+f.id+'">'+f.opts.map(x=>'<option value="'+esc(x[0])+'">'+esc(x[1])+'</option>').join('')+'</select>':f.type==='number'?'<input class="in" id="f_'+f.id+'" type="number" inputmode="numeric" step="1" placeholder="'+esc(f.ph||'')+'">':'<textarea id="f_'+f.id+'" maxlength="200" placeholder="'+esc(f.ph||'')+'"></textarea>')).join('');
  const mo=$('mo');mo.textContent=o.ok||'ยืนยัน';mo.className='btn '+(o.cls||'gl');$('md').hidden=false;
  const close=v=>{$('md').hidden=true;asking=false;mo.onclick=mc.onclick=null;res(v)};
  const mc=$('mc');mc.onclick=()=>{if(!busy)close(false)};let busy=false;
  mo.onclick=async()=>{if(busy)return;const v={};(o.fields||[]).forEach(f=>{v[f.id]=$('f_'+f.id).value});
   const why=(v.reason||'').trim();if(why.length<3)return $('me2').textContent='ต้องใส่เหตุผลอย่างน้อย 3 ตัวอักษร';
   if(o.check){const m=o.check(v);if(m)return $('me2').textContent=m}
   busy=true;mo.disabled=true;mc.disabled=true;$('me2').textContent='';
   let r;try{r=await o.run(v,why)}catch(e){r={error:{message:e&&e.message||'ผิดพลาด'}}}
   busy=false;mo.disabled=false;mc.disabled=false;
   if(r&&r.error)return $('me2').textContent=r.error.message;
   close(true)};
  const f=$('mf').querySelector('input,select,textarea');if(f)f.focus()})}
const RS={name:'reason',id:'reason',label:'เหตุผล (อย่างน้อย 3 ตัวอักษร)',ph:'เช่น แก้ไขตามคำร้อง'};
async function act(a){
 if(asking||!info)return;asking=true;const u=info.user_id,nm=info.username||'ผู้เล่น';let ok=false;
 if(a==='ban'||a==='unban'){const b=a==='ban';ok=await ask({title:(b?'แบน ':'ปลดแบน ')+nm,desc:b?'ผู้เล่นจะเข้าเล่นไม่ได้ ทีมงานแบนไม่ได้':'ผู้เล่นจะกลับมาเล่นได้',fields:[{...RS,id:'reason'}],ok:b?'แบน':'ปลดแบน',cls:b?'gl':'gd',run:(v,w)=>sb.rpc('admin_set_ban',{p_user:u,p_banned:b,p_reason:w})})}
 else if(a==='chest')ok=await ask({title:'ให้หีบ '+nm,desc:'ผู้เล่นได้สิทธิ์เปิดหีบ 1 ใบ (หักเหรียญตามราคาตอนเปิด)',fields:[{id:'kind',type:'select',label:'ชนิดหีบ',opts:[['province','หีบจังหวัด']]},{...RS}],ok:'ให้หีบ',cls:'gd',run:(v,w)=>sb.rpc('admin_grant_chest',{p_user:u,p_kind:v.kind,p_reason:w})});
 else if(a==='wallet')ok=await ask({title:'ปรับกระเป๋า '+nm,desc:'ใส่จำนวนบวกเพื่อเพิ่ม ลบเพื่อหัก (สูงสุด 100,000 ต่อครั้ง) ยอดต้องไม่ติดลบ',fields:[{id:'cur',type:'select',label:'สกุล',opts:[['coin','เหรียญ'],['diamond','เพชร']]},{id:'delta',type:'number',label:'จำนวน',ph:'เช่น 500 หรือ -200'},{...RS}],ok:'ปรับ',cls:'gd',
  check:v=>{const n=Number(v.delta);if(v.delta===''||!Number.isInteger(n)||n===0)return 'ใส่จำนวนเต็มที่ไม่ใช่ 0';if(Math.abs(n)>100000)return 'ปรับได้ไม่เกิน 100,000 ต่อครั้ง'},
  run:(v,w)=>sb.rpc('admin_adjust_wallet',{p_user:u,p_currency:v.cur,p_delta:Number(v.delta),p_reason:w})});
 else if(a==='vip')ok=await ask({title:'ตั้ง VIP '+nm,desc:'ป้ายและสีชื่อตามระดับ ตกแต่งอย่างเดียว ไม่มีผลต่อการเล่น · ตอนนี้: '+(info.vip_level?'VIP '+info.vip_level:'ไม่มี'),fields:[{id:'lv',type:'select',label:'ระดับ',opts:[['1','VIP 1 · เขียว'],['2','VIP 2 · ม่วง'],['3','VIP 3 · ชมพู'],['0','ถอด VIP']]},{...RS}],ok:'ตั้ง',cls:'sv',run:(v,w)=>sb.rpc('admin_set_vip',{p_user:u,p_level:Number(v.lv),p_reason:w})});
  else if(a==='promote'||a==='demote'){const p=a==='promote';ok=await ask({title:(p?'เลื่อนเป็นแอดมิน ':'ถอดแอดมิน ')+nm,desc:p?'แอดมินตอบแชต แบน และลบข้อความได้ แต่ปรับกระเป๋า แจกหีบ หรือเลื่อนคนไม่ได้':'บัญชีนี้จะกลับเป็นผู้เล่นทั่วไป',fields:[{...RS}],ok:p?'เลื่อน':'ถอด',cls:p?'sv':'gl',run:(v,w)=>sb.rpc('admin_set_staff_role',{p_user:u,p_role:p?'admin':'none',p_reason:w})})}
 asking=false;if(ok){toast('ทำรายการแล้ว');await openThread(u,true)}}
async function delMsg(id){
 if(asking)return;asking=true;
 const ok=await ask({title:'ลบข้อความ',desc:'ข้อความจะหายจากแชตของทั้งสองฝ่าย และมีบันทึกไว้ว่าใครลบ',fields:[{...RS}],ok:'ลบ',cls:'gl',run:(v,w)=>sb.rpc('admin_delete_support_message',{p_id:Number(id),p_reason:w})});
 asking=false;if(ok){toast('ลบแล้ว');await openThread(cur,true)}}
async function find(){
 const q=$('sq').value.trim(),box=$('sr');if(q.length<2){box.innerHTML='<p class="hint">พิมพ์ชื่ออย่างน้อย 2 ตัวอักษร</p>';return}
 $('sb2').disabled=true;const {data,error}=await sb.rpc('admin_find_user',{p_name:q});$('sb2').disabled=false;
 if(error){box.innerHTML='<p class="err">'+esc(error.message)+'</p>';return}
 box.innerHTML=(data||[]).length?data.map(x=>'<button type="button" class="th" data-u="'+esc(x.user_id)+'" style="--k:var(--c'+rk(x.region_id)+')"><span class="t"><span>'+nameFx(x.username,x.staff_role,x.vip_level)+'</span>'+badge(x.staff_role,true,x.vip_level)+'</span><small>'+(x.region_id?RGN[rk(x.region_id)]:'')+(x.banned?' · ถูกแบน':'')+(x.is_bot?' · บอท':'')+'</small></button>').join(''):'<p class="hint">ไม่พบผู้เล่น</p>'}
async function init(){
 if(!sb){$('ld').textContent='โหลดระบบไม่สำเร็จ';return}
 const {data:{session}}=await sb.auth.getSession();if(!session)return location.replace('index.html');MYID=session.user.id;
 const [a,r]=await Promise.all([sb.rpc('is_admin'),sb.rpc('get_my_staff_role')]);
 if(a.error||a.data!==true)return location.replace('play.html');
 ROLE=(r&&!r.error&&r.data)||'admin';$('me').innerHTML=badge(ROLE);
 $('fs').hidden=ROLE!=='ceo';
 $('ld').hidden=true;$('app').hidden=false;await loadList();
 timer=setInterval(()=>{if(document.visibilityState==='visible'&&!asking){loadList();if(cur)openThread(cur,true)}},20000)}
$('lst').onclick=$('sr').onclick=e=>{const b=e.target.closest('.th');if(b)openThread(b.dataset.u)};
$('ac').onclick=e=>{const b=e.target.closest('button[data-a]');if(b)act(b.dataset.a)};
$('log').onclick=e=>{const b=e.target.closest('.x');if(b)delMsg(b.dataset.id)};
$('sb2').onclick=find;$('sq').addEventListener('keydown',e=>{if(e.key==='Enter')find()});
$('sd').onclick=reply;$('rf').onclick=()=>{loadList();if(cur)openThread(cur,true)};
$('bk').onclick=()=>{$('cols').classList.remove('open')};
$('bd').addEventListener('input',e=>{$('ct').textContent=e.target.value.length+'/1000'});
$('bd').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey))reply()});
init();
/* ล็อกซูม: กันท่าจีบนิ้วบน iOS เหมือน play.html */
['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{if(e.touches.length>1||(e.scale&&e.scale!==1))e.preventDefault()},{passive:false});
document.addEventListener('wheel',e=>{if(e.ctrlKey)e.preventDefault()},{passive:false});
</script></body></html>
